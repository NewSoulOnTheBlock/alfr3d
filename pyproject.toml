[build-system]
requires = ["setuptools>=45.0"]
build-backend = "setuptools.build_meta"

[project]
name = "alfr3d"
version = "1.0.0"
description = "Alfr3d — personal steward agent harness (CLI, channels, skills, SOUL)"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0",
    "requests>=2.28.2",
]

[project.scripts]
alfr3d = "cli.cli:main"

[project.urls]
Homepage = "https://github.com/NewSoulOnTheBlock/alfr3d"
Documentation = "https://docs.alfr3d.local"

# The CLI is the customer entrypoint; the full product lives in the same tree
# (agent, bridge, channel, …). Editable install from the repo is the supported
# path: `pip install -e .` then `alfr3d chat`.
[tool.setuptools.packages.find]
include = ["cli*"]

[tool.setuptools.package-data]
cli = ["VERSION"]
